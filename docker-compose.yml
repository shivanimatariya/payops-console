# One-command full-stack run for PayOps Console.
#   docker compose up --build
# Frontend: http://localhost:5174   Backend: http://localhost:8000
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APEX_SECRET: change-me
    volumes:
      - app-data:/data
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5174:80"
    depends_on:
      - backend
volumes:
  app-data:
